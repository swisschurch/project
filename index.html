<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swiss Church 업무 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--panel:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e5e3dc;--accent:#2f4b7c;--accent-ink:#fff;--gold:#b8860b;--soft:#f0eee8;--late:#c0392b;
--todo:#8a94a6;--doing:#2563eb;--done:#16a34a;--rej:#dc2626;--later:#a16207}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1c2028;--ink:#e8eaee;--muted:#9aa3b2;--line:#2c323d;--accent:#7aa2e3;--accent-ink:#0f1420;--soft:#232833;--gold:#e0b33a}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1c2028;--ink:#e8eaee;--muted:#9aa3b2;--line:#2c323d;--accent:#7aa2e3;--accent-ink:#0f1420;--soft:#232833;--gold:#e0b33a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Noto Sans KR',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--rej)}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav span{font-weight:700;min-width:96px;text-align:center}
.month-nav button{padding:2px 10px}
#slogan{flex:1;min-width:220px;cursor:pointer;padding:8px 14px;border-radius:10px;background:var(--soft);display:flex;gap:10px;align-items:baseline}
.sl-label{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
.sl-text{font-weight:700;font-size:16px}
.sl-empty{color:var(--muted)}
.sync{font-size:12px;color:var(--muted)}
.sync.ok{color:var(--done)}.sync.err{color:var(--rej)}.sync.warn{color:var(--later)}
#history[hidden]{display:none}
#history{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;align-items:center;border-bottom:1px solid var(--line)}
.h-title{font-size:12px;color:var(--muted);white-space:nowrap}
.h-chip{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding:4px 12px;font-size:13px;flex-shrink:0}
.h-chip small{font-size:11px;color:var(--muted)}
.h-chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.m-btn{border:0;background:none;font-weight:700;padding:4px 8px;white-space:nowrap}
.m-btn:hover{background:var(--soft)}
.m-btn i{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.m-btn.on{background:var(--soft)}
.past-h{font-size:12px;color:var(--later);white-space:nowrap;display:flex;align-items:center;gap:6px}
.past-h button{font-size:12px;padding:2px 8px}
.past{margin-left:auto;font-size:12px;color:var(--later);white-space:nowrap}
.past button{font-size:12px;padding:2px 8px;margin-left:6px}
.layout{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:20px;max-width:1600px;margin:0 auto}
main{min-width:0}
aside{display:flex;flex-direction:column;gap:2px}
.d-group{font-size:11px;color:var(--muted);margin:12px 8px 4px;font-weight:700}
.d-item{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px}
.d-item i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-item span{margin-left:auto;font-size:12px;color:var(--muted)}
.d-item.on{background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:700}
#tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
#tabs button{border:0;background:none;border-radius:0;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted)}
#tabs button.on{border-color:var(--accent);color:var(--ink);font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:160px}
.toolbar label{display:flex;align-items:center;gap:4px;font-size:13px}
.grow{flex:1}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sec h3{margin:0;font-size:15px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.pinned{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.tstar{border:0;background:none;padding:0 2px;font-size:16px;line-height:1;color:var(--line);flex-shrink:0;border-radius:4px}
.tstar:hover{color:var(--gold);border:0}
.tstar.on{color:var(--gold)}
.pstar{font-size:18px}
.star-box{font-weight:700}
.star-box .sb{color:var(--gold);width:auto;font-size:14px}
.star-box.on{background:color-mix(in srgb,var(--gold) 14%,var(--panel));box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 50%,var(--line))}
.d-sep{height:1px;background:var(--line);margin:6px 8px}
.lang-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sh{margin:0 0 10px;font-size:14px}
.note-s{font-size:12px;color:var(--muted);margin:6px 0 0 24px}
.star-hint{font-size:13px;color:var(--muted);margin:0 0 12px}
@media (max-width:760px){.d-sep{display:none}}
details.sec>summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--muted);transition:transform .15s}
details[open].sec>summary::before{transform:rotate(90deg)}
details[open].sec>summary{margin-bottom:6px}
.badge{font-size:12px;background:var(--soft);padding:0 8px;border-radius:10px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{padding:2px 10px;font-size:12px;border-radius:20px}
.chips button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.grp-h{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 2px;display:flex;align-items:center;gap:6px}
.grp-h i{width:8px;height:8px;border-radius:50%}
.task{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line)}
.task .bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.t-body{flex:1;min-width:0;cursor:pointer}
.t-title{font-weight:500}
.s-done .t-title{text-decoration:line-through;color:var(--muted)}
.s-rej .t-title{color:var(--muted)}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.dtag{padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.dtag.off{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.ptag{padding:0 6px;border-radius:4px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);font-weight:500;font-size:12px;white-space:nowrap}
.pboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
@media (max-width:1180px){.pboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.pboard{grid-template-columns:1fr}}
.proj{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:14px 14px;min-width:0;display:flex;flex-direction:column}
.proj .fill{flex:1;min-height:10px}
.proj .task{gap:6px}
.pgrip{font-size:17px;padding:4px 2px;margin-right:-2px}
.grip{cursor:grab;color:var(--muted);opacity:.35;font-size:15px;line-height:1;padding:6px 2px;touch-action:none;user-select:none;flex-shrink:0;align-self:center}
.task:hover .grip,.proj-h:hover .pgrip{opacity:.9}
@media (hover:none){.grip{opacity:.6}}
.tlist{min-height:8px}
.tl-empty{margin:6px 0;padding:10px;border:1px dashed transparent;border-radius:8px}
.tlist:has(> .task) > .tl-empty{display:none}
body.dragging .tl-empty{border-color:var(--line)}
body.dragging .tlist{background:color-mix(in srgb,var(--accent) 3%,transparent);border-radius:8px}
.drag-ghost{opacity:.35;background:var(--soft)}
.drag-chosen{background:var(--panel);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:8px}
.sortable-fallback{background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:8px;opacity:.95!important}
body.dragging,body.dragging *{cursor:grabbing!important}
.proj select.st{max-width:108px}
.proj.none{border-top-style:dashed;border-top-color:var(--muted)}
.proj-h{display:flex;align-items:center;gap:6px}
.proj-h h3{margin:0;font-size:16px;flex:1;min-width:0}
.proj-h .grow{flex:1}
.proj-title{margin:10px 0 0;font-size:17px;line-height:1.35;cursor:pointer;border-radius:6px}
.proj-title.u{margin:0}
.proj-title:hover{color:var(--accent)}
.proj-title i{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px;vertical-align:2px}
.proj .sub-h{margin-top:12px}
.proj-h button,.proj-h select{flex-shrink:0}
.proj-desc{margin:4px 0 0;color:var(--muted);font-size:13px}
.proj-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 6px}
.proj-meta .prog{display:inline-block;width:120px;margin:0}
button.mini{padding:1px 8px;font-size:12px}
button.mini:disabled{opacity:.35;cursor:default}
select.prio{border:0;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff}
select.prio option{color:var(--ink);background:var(--panel)}
.pr-urgent{background:#dc2626}.pr-high{background:#ea7a1a}.pr-mid{background:#5b7bb0}.pr-low{background:#9aa3b2}
.sub-h{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 2px}
details.sub>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:8px 0 2px;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::before{content:'▸ '}
details[open].sub>summary::before{content:'▾ '}
.addline{border:1px dashed var(--line);background:none;width:100%;margin-top:0;color:var(--muted);font-size:13px}
.late{color:var(--late);font-weight:700}
.note{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--gold);margin-right:4px}
select.st{border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:12px;background:var(--panel);font-weight:500}
select.st.s-todo{color:var(--todo)}select.st.s-doing{color:var(--doing);border-color:var(--doing)}select.st.s-done{color:var(--done)}select.st.s-rej{color:var(--rej)}select.st.s-later{color:var(--later)}
.empty{color:var(--muted);font-size:13px;margin:6px 0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--soft);text-align:center;font-size:12px;padding:6px;color:var(--muted);font-weight:700}
.cal .wd:first-child{color:var(--rej)}
.day{background:var(--panel);min-height:110px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:hover{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.day.blank{background:var(--soft);cursor:default}
.dn{font-size:12px;font-weight:700;padding:0 6px;align-self:flex-start}
.day.sun .dn{color:var(--rej)}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:10px}
.ci{--c:var(--muted);font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c)}
.ci.off{background:color-mix(in srgb,var(--gold) 24%,transparent);border-left-color:var(--gold);font-weight:700}
.ci.tk{background:none;border-left:0;border-bottom:2px solid var(--c);border-radius:0;color:var(--muted)}
.ci.hid{display:none}
.day.expanded .ci.hid{display:block}.day.expanded .more{display:none}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.agenda{margin-top:16px}
.ag{display:flex;gap:12px;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.ag b{min-width:64px;font-size:13px}
/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:14px}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-h b{font-size:15px}
.pc-h button{font-size:12px;padding:2px 8px}
.pcard p{margin:4px 0 8px;color:var(--muted);font-size:13px}
.ptags{display:flex;gap:4px;flex-wrap:wrap}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:10px 0 2px}
.prog i{display:block;height:100%;background:var(--c)}
.pcard small{color:var(--muted)}
.pcard ul{list-style:none;padding:0;margin:10px 0}
.pcard li{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.pcard li em{margin-left:auto;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.pill{font-size:11px;padding:0 6px;border-radius:10px;white-space:nowrap;color:#fff;flex-shrink:0}
.pill.s-todo{background:var(--todo)}.pill.s-doing{background:var(--doing)}.pill.s-done{background:var(--done)}.pill.s-rej{background:var(--rej)}.pill.s-later{background:var(--later)}
/* dialog */
dialog{border:0;border-radius:14px;padding:20px;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,30,.45)}
dialog h3{margin:0 0 14px}
form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
form input:not([type=checkbox]):not([type=file]),form select,form textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);font-size:14px;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px;margin:0}
.relbox{margin-bottom:10px}
.relbox>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;padding:4px 0;display:flex;align-items:center;gap:6px}
.relbox>summary::-webkit-details-marker{display:none}
.relbox>summary::before{content:'▸';font-size:11px}
.relbox[open]>summary::before{content:'▾'}
.relbox[open]>summary{margin-bottom:6px}
.rel{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.help{font-size:13px;color:var(--muted);background:var(--soft);padding:10px 12px;border-radius:8px;margin:0 0 12px}
.btnlike{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);font-size:14px;margin:0}
@media (max-width:760px){
 header{padding:12px 16px;gap:10px}
 #history{padding:8px 16px}
 .layout{grid-template-columns:1fr;padding:12px 16px;gap:10px}
 aside{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
 .d-group{display:none}
 .d-item{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:4px 10px;flex-shrink:0}
 .d-item span{margin-left:4px}
 .day{min-height:64px;padding:2px}
 .ci{font-size:10px;padding:0 3px}
 .task{flex-wrap:wrap}
 .row2{grid-template-columns:1fr}
}
.dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--rej);color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:2px}
#who{font-size:13px;color:var(--muted);white-space:nowrap}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mi{flex:1;min-width:160px}
.seen::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:5px;vertical-align:1px}
.seen.on::before{background:var(--done)}
.mb{display:flex;gap:6px;flex-wrap:wrap}
.mb button.primary{border-color:var(--accent)}
.empty-box{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate[hidden],#app[hidden]{display:none}
.g-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.06)}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.g-top b{font-size:16px}
.g-card h2{margin:0 0 14px;font-size:20px}
.g-p{color:var(--muted);margin:0 0 16px}
.g-err{color:var(--rej);font-size:13px;margin:0 0 10px}
.g-ok{color:var(--done);font-size:13px;margin:0 0 10px}
.gate-lang button{padding:3px 10px;font-size:12px}
form label small{color:var(--muted);font-weight:400}
button.wide{width:100%;padding:10px;margin-top:4px}
button.link{border:0;background:none;color:var(--accent);padding:10px 0 0;font-size:13px}
button:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
<header>
  <div class="brand" id="brand">업무 정리</div>
  <div class="month-nav"><button data-act="prevM" aria-label="이전 달">‹</button><button id="monthLabel" class="m-btn" data-act="hist"></button><button data-act="nextM" aria-label="다음 달">›</button></div>
  <span class="past-h" id="pastFlag"></span>
  <div id="slogan" data-act="slogan" title="클릭해서 슬로건 편집"></div>
  <span class="sync" id="sync"></span>
  <span id="who"></span>
  <button id="membersBtn" data-act="members" hidden></button>
  <button data-act="settings">설정</button>
</header>
<div id="history" hidden></div>
<div class="layout">
  <aside id="side"></aside>
  <main>
    <nav id="tabs"></nav>
    <div id="view"></div>
  </main>
</div>
</div>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/firebase@13.1.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@13.1.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@13.1.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
/* ==========================================================
   Firebase 설정 — Firebase 콘솔 › 프로젝트 설정 › 내 앱(웹 앱)의
   firebaseConfig 값을 그대로 복사해 아래에 붙여넣으세요.
   (이 값은 공개되어도 괜찮습니다. 데이터는 로그인·승인 규칙으로 보호됩니다.)
   ========================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFOcxfXBFbCCJ5r1r0epEzpIx8hlO4OAw",

const b64enc=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(bin)};

/* ========== 입력 내용 이중 언어 (한국어 field / 영어 field_en) ========== */
const HANGUL=/[가-힣]/;
const TEXT_FIELDS={tasks:['title','note'],projects:['name','desc'],events:['title','note']};
// 영어로 쓴 내용이 한국어 칸에 있으면 영어 칸으로 (반대도 마찬가지)
function norm(o,f){const a=o[f]||'',b=o[f+'_en']||'';
  if(a&&!b&&!HANGUL.test(a)&&/[A-Za-z]/.test(a)){o[f+'_en']=a;o[f]=''}
  else if(b&&!a&&HANGUL.test(b)){o[f]=b;o[f+'_en']=''}}
function eachText(d,fn){
  for(const k in TEXT_FIELDS)(d[k]||[]).forEach(o=>TEXT_FIELDS[k].forEach(f=>fn(o,f)));
  const ms=new Set([...Object.keys(d.slogans),...Object.keys(d.slogansEn)]);
  ms.forEach(m=>{const o={s:d.slogans[m]||'',s_en:d.slogansEn[m]||''};fn(o,'s');
    if(o.s)d.slogans[m]=o.s;else delete d.slogans[m];if(o.s_en)d.slogansEn[m]=o.s_en;else delete d.slogansEn[m]});
}

/* 자동 번역 (MyMemory 무료 번역 API) */
let trCache=Object.assign({ko:{},en:{}},lsGet('wm_trcache')||{});
let autoTr=lsGet('wm_autotr')!==false;
const trQ=[];let trBusy=false,trStop=false;
const canPersist=()=>!!me&&me.status==='approved';
function decodeEnt(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value}
function pick(ko,en){ko=ko||'';en=en||'';
  if(lang==='en'){if(en||!ko)return en;const c=trCache.en[ko];if(c)return c;queueTr(ko,'en');return ko}
  if(ko||!en)return ko;const c=trCache.ko[en];if(c)return c;queueTr(en,'ko');return en}
const tx=(o,f)=>pick(o[f],o[f+'_en']);
const sloganOf=m=>pick(data.slogans[m],data.slogansEn[m]);
function queueTr(src,to){
  if(!autoTr||trStop||src.length>450)return;
  const k=to+'\u0001'+src;if(trQ.includes(k))return;
  trQ.push(k);if(!trBusy)setTimeout(runTr,30);
}
async function runTr(){
  if(trBusy)return;trBusy=true;let got=0;
  while(trQ.length&&!trStop){
    const [to,src]=trQ.shift().split('\u0001');if(trCache[to][src])continue;
    try{
      const from=to==='en'?'ko':'en';
      const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(src)}&langpair=${from}|${to}`);
      const j=await r.json();const out=decodeEnt((j.responseData&&j.responseData.translatedText)||'');
      if(Number(j.responseStatus)!==200||/MYMEMORY WARNING|QUERY LENGTH LIMIT EXCEEDED/.test(out)){trStop=true;break}
      if(out){trCache[to][src]=out;got++}
    }catch(e){trStop=true;break}
  }
  trBusy=false;
  if(got){lsSet('wm_trcache',trCache);if(canPersist()&&persistTr())save();else render()}
}
// 번역 결과를 데이터에도 저장 (편집 권한이 있을 때) → 다른 사람도 같은 번역을 봄
function persistTr(){let ch=false;
  eachText(data,(o,f)=>{const ko=o[f],en=o[f+'_en'];
    if(ko&&!en&&trCache.en[ko]){o[f+'_en']=trCache.en[ko];ch=true}
    else if(en&&!ko&&trCache.ko[en]){o[f]=trCache.ko[en];ch=true}});
  return ch}

function bi(f,o,label,area){

    return `<label>${label} · ${l==='ko'?'한국어':'English'}${area?`<textarea name="${nm}">${v}</textarea>`:`<input name="${nm}" value="${v}">`}</label>`}).join('')}</div>`;
}
// 한쪽만 고치면 다른 쪽은 다시 번역되도록 비움
function biRead(fd,o,f){
  let ko=(fd.get(f)||'').trim(),en=(fd.get(f+'_en')||'').trim();
  const ok=o[f]||'',oe=o[f+'_en']||'';
  if(ko!==ok&&en===oe&&oe)en='';else if(en!==oe&&ko===ok&&ok)ko='';
  const r={[f]:ko,[f+'_en']:en};norm(r,f);return r;
}

/* ========== Firestore 동기화 ==========
   업무·프로젝트·일정은 항목마다 문서 하나 → 서로 다른 항목을 동시에 고쳐도 충돌하지 않음.
   바뀐 항목만 저장하고, 다른 사람의 변경은 실시간으로 받아옴. */
const COLS=['tasks','projects','events'];
function stable(v){
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
const Store={
  snap:{tasks:{},projects:{},events:{}},metaSnap:null,unsub:[],ready:{},renderT:null,
  reset(){this.stop();this.snap={tasks:{},projects:{},events:{}};this.metaSnap=null;this.ready={}},
  stop(){this.unsub.forEach(f=>f());this.unsub=[]},
  metaOf(){return {deptGroups:data.deptGroups,slogans:data.slogans,slogansEn:data.slogansEn}},
  loaded(){return COLS.every(c=>this.ready[c])&&this.ready.meta},
  isEmpty(){return this.loaded()&&!data.tasks.length&&!data.projects.length&&!data.events.length},
  async commit(){
    if(!db||!me||me.status!=='approved')return;
    const ops=[];
    for(const c of COLS){
      const cur=new Map(data[c].map(o=>[o.id,o]));
      for(const [id,o] of cur){
        const {updBy,updAt,...rest}=o,j=stable(rest);
        if(this.snap[c][id]!==j){o.updBy=me.name||me.loginId;o.updAt=Date.now();ops.push(['set',c,id,JSON.parse(JSON.stringify(o))]);this.snap[c][id]=j}
      }
      for(const id of Object.keys(this.snap[c]))if(!cur.has(id)){ops.push(['del',c,id]);delete this.snap[c][id]}
    }
    const mj=stable(this.metaOf());
    if(mj!==this.metaSnap){ops.push(['set','meta','main',JSON.parse(JSON.stringify(this.metaOf()))]);this.metaSnap=mj}
    if(!ops.length)return;
    setSync('sPending');
    try{
      for(let i=0;i<ops.length;i+=400){
        const b=db.batch();
        ops.slice(i,i+400).forEach(([k,c,id,v])=>{const r=db.collection(c).doc(id);k==='set'?b.set(r,v):b.delete(r)});
        await b.commit();
      }
      setSync('sSaved','ok');
    }catch(e){
      console.error(e);
      ops.forEach(([k,c,id])=>{if(k==='set'){if(c==='meta')this.metaSnap=null;else delete this.snap[c][id]}});
      setSync('sSaveFail','err',e.code||e.message);
    }
  },
  listen(){
    this.stop();
    COLS.forEach(c=>this.unsub.push(db.collection(c).onSnapshot(qs=>{
      qs.docChanges().forEach(ch=>{
        const id=ch.doc.id;
        if(ch.type==='removed'){data[c]=data[c].filter(o=>o.id!==id);delete this.snap[c][id];return}
        const v=ch.doc.data();v.id=id;
        const {updBy,updAt,...rest}=v;
        this.snap[c][id]=stable(rest);
        const ex=data[c].find(o=>o.id===id);
        if(ex){Object.keys(ex).forEach(k=>delete ex[k]);Object.assign(ex,v)}else data[c].push(v);
      });
      if(c==='tasks')data.tasks.sort((a,b)=>(a.seq||0)-(b.seq||0));
      this.ready[c]=true;this.changed();
    },e=>this.fail(e))));
    this.unsub.push(db.collection('meta').doc('main').onSnapshot(s=>{
      if(s.exists){const v=s.data();
        data.deptGroups=withDefaultDepts(v.deptGroups);
        data.slogans=v.slogans||{};data.slogansEn=v.slogansEn||{};
        this.metaSnap=stable(this.metaOf());}
      this.ready.meta=true;this.changed();
    },e=>this.fail(e)));
  },
  fail(e){console.error(e);setSync('sReadFail','err',e.code||e.message)},
  changed(){clearTimeout(this.renderT);this.renderT=setTimeout(()=>{if(this.loaded()&&me&&me.status==='approved'){showScreen('app');render()}},60)}
};

async function gateSubmit(f){
  const fd=new FormData(f),mode=f.dataset.mode;gateErr='';
  const btn=f.querySelector('button.primary');btn.disabled=true;
  try{
    if(mode==='login'){
      const id=(fd.get('id')||'').trim().toLowerCase();
      await auth.signInWithEmailAndPassword(toEmail(id),fd.get('pw'));
      gateMsg='';return;
    }
    const name=(fd.get('name')||'').trim(),dept=fd.get('dept')||'';
    if(mode==='signup'){
      const id=(fd.get('id')||'').trim().toLowerCase(),pw=fd.get('pw');
      if(!ID_RE.test(id))throw {msg:tr('eId')};
      if(pw.length<6)throw {msg:tr('ePw')};
      if(pw!==fd.get('pw2'))throw {msg:tr('ePw2')};
      if(!name)throw {msg:tr('eName')};
      signingUp=true;
      const cred=await auth.createUserWithEmailAndPassword(toEmail(id),pw);
      await db.collection('users').doc(cred.user.uid).set({loginId:id,name,dept,status:'pending',role:'member',createdAt:Date.now()});
      signingUp=false;gateMode='login';
    }else if(mode==='missing'){
      if(!name)throw {msg:tr('eName')};
      const u=auth.currentUser;
      await db.collection('users').doc(u.uid).set({loginId:fromEmail(u.email),name,dept,status:'pending',role:'member',createdAt:Date.now()});
    }
  }catch(e){
    signingUp=false;gateErr=e.msg||authErr(e);
    showScreen($('#gate').dataset.screen||'login');
  }finally{if(btn.isConnected)btn.disabled=false}
}

  if(new URLSearchParams(location.search).has('emulator')){auth.useEmulator('http://127.0.0.1:9099');db.useEmulator('127.0.0.1',8080)}
  showScreen('loading');
  auth.onAuthStateChanged(u=>{
    if(meUnsub){meUnsub();meUnsub=null}
    if(membersUnsub){membersUnsub();membersUnsub=null}
    Store.reset();data=emptyData();me=null;members=[];
    if(!u){gateMode='login';showScreen('login');return}
    showScreen('loading');
    meUnsub=db.collection('users').doc(u.uid).onSnapshot(s=>{
      if(!s.exists){me={uid:u.uid,loginId:fromEmail(u.email),status:'missing'};if(!signingUp)showScreen('missing');return}
      const wasApproved=me&&me.status==='approved';
      touchSeen(u.uid,s.data().lastSeen);

      if(me.status==='approved'){
        if(!wasApproved){Store.reset();data=emptyData();Store.listen()}
        watchMembers();

  });

          <div class="t-meta"><span>${esc(m.loginId||'')}</span>${m.dept?`<span>${esc(L(m.dept))}</span>`:''}</div>
          <div class="t-meta"><span class="seen ${m.lastSeen&&Date.now()-m.lastSeen<6*60000?'on':''}" title="${m.lastSeen?fmtStamp(m.lastSeen):''}">${tr('lastSeen')}: ${m.lastSeen?ago(m.lastSeen):tr('never')}</span>${m.createdAt?`<span>${tr('joined')}: ${fmtStamp(m.createdAt)}</span>`:''}</div></div>
          <div class="mb">${btns}</div></div>`}).join(''):`<p class="empty">${tr('mNone')}</p>`}`;
  };

function memberAction(a,id){
  const m=members.find(x=>x.uid===id);if(!m)return;const nm=m.name||m.loginId;
  if(a==='mApprove')setMember(id,{status:'approved'});
  else if(a==='mReject')setMember(id,{status:'rejected'});
  else if(a==='mSuspend'){if(confirm(tr('confirmSuspend',nm)))setMember(id,{status:'rejected'})}
  else if(a==='mAdmin')setMember(id,{role:'admin'});
  else if(a==='mUnadmin'){if(confirm(tr('confirmUnadmin',nm)))setMember(id,{role:'member'})}
  else if(a==='mRemove'){if(confirm(tr('confirmRemove',nm)))db.collection('users').doc(id).delete().catch(e=>alert(authErr(e)))}
}

function importData(d){
  const fresh=migrate(JSON.parse(JSON.stringify(d)));
  delete fresh.updatedAt;delete fresh.version;
  data.deptGroups=fresh.deptGroups;data.slogans=fresh.slogans;data.slogansEn=fresh.slogansEn;
  data.projects=fresh.projects;data.tasks=fresh.tasks;data.events=fresh.events;

function row(t,showProj){
  const p=data.projects.find(x=>x.id===t.project);
  const per=period(t);
  const late=t.end&&t.end<todayStr()&&!['완료','반려','차후'].includes(t.status);
  const rel=t.related.map(r=>data.tasks.find(x=>x.id===r)).filter(Boolean);
  return `<div class="task s-${SCLS[t.status]}" data-id="${t.id}">
    <span class="grip" title="${tr('dragTip')}" aria-hidden="true">⠿</span>
    <div class="t-body" data-act="editTask" data-id="${t.id}">
      <div class="t-title">${esc(tx(t,'title'))}</div>
      <div class="t-meta">
        <span class="dtag">${esc(L(t.dept))}</span>
        ${per?`<span class="${late?'late':''}">${per}${late?tr('overdue'):''}</span>`:''}
        ${showProj&&p?`<span class="ptag" style="--c:${p.color}">${esc(tx(p,'name'))}</span>`:''}
        ${rel.length?`<span title="${esc(rel.map(x=>L(x.dept)+' · '+tx(x,'title')).join('\n'))}">${tr('related',rel.length)}</span>`:''}
        ${tx(t,'note')?`<span class="note">${esc(tx(t,'note'))}</span>`:''}
      </div>

  </div>`;
}
const byDept=a=>{const o=allDepts();return [...a].sort((x,y)=>o.indexOf(x.dept)-o.indexOf(y.dept))};
const bySeq=a=>[...a].sort((x,y)=>(x.seq||0)-(y.seq||0));
const rows=(a,list)=>a.length?`<div class="tlist" data-list="${list}">${bySeq(a).map(t=>row(t)).join('')}</div>`:'';
const sortedProjects=()=>[...data.projects].sort((a,b)=>PRIOS.indexOf(a.priority)-PRIOS.indexOf(b.priority)||a.order-b.order);

function projBlock(p,ts){
  const key=p?p.id:'none';
  const cur=ts.filter(t=>['시작 전','진행 중','반려'].includes(t.status)&&(ui.stf==='전체'||t.status===ui.stf));
  const later=ts.filter(t=>t.status==='차후'),done=ts.filter(t=>t.status==='완료');
  const counted=ts.filter(t=>t.status!=='반려'),pct=counted.length?Math.round(done.length/counted.length*100):0;
  const depts=allDepts().filter(d=>ts.some(t=>t.dept===d));
  const folded=ui.fold[key],info=!!(ui.info||{})[key];
  let head;
  if(p){
    head=`<div class="proj-h">
      <span class="grip pgrip" title="${tr('dragTip')}" aria-hidden="true">⠿</span>
      <select class="prio pr-${PCLS[p.priority]}" data-id="${p.id}" aria-label="${tr('priority')}">${prioOpts(p.priority)}</select>
      <button class="tstar pstar ${p.starred?'on':''}" data-act="pstar" data-id="${p.id}" title="${tr('starTip')}">★</button>
      <span class="grow"></span>
      <button class="mini" data-act="editProject" data-id="${p.id}">${tr('edit')}</button>
      <button class="mini" data-act="pfold" data-k="${key}">${folded?tr('unfold'):tr('fold')}</button>
    </div>
    <h3 class="proj-title" data-act="pinfo" data-k="${key}" title="${tr('infoTip')}">${esc(tx(p,'name'))}<i>${info?'▴':'▾'}</i></h3>
    ${info&&tx(p,'desc')?`<p class="proj-desc">${esc(tx(p,'desc'))}</p>`:''}`;
  }else{
    head=`<div class="proj-h"><h3 class="proj-title u" data-act="pinfo" data-k="none" title="${tr('infoTip')}">${tr('unassigned')}<i>${info?'▴':'▾'}</i></h3><span class="grow"></span><button class="mini" data-act="pfold" data-k="none">${folded?tr('unfold'):tr('fold')}</button></div>
    ${info?`<p class="proj-desc">${tr('unassignedHint')}</p>`:''}`;
  }
  const meta=!info?'':`<div class="proj-meta">
      ${p?`<span class="prog"><i style="width:${pct}%"></i></span><span>${tr('doneOf',done.length,counted.length,pct)}</span>`:`<span>${tr('count',ts.length)}</span>`}
      ${depts.map(d=>`<span class="dtag">${esc(L(d))}</span>`).join('')}
    </div>`;
  const body=folded?'':`
    <div class="sub-h">${tr('current')} <span class="badge">${cur.length}</span></div>
    <div class="tlist" data-list="cur:${key}">${bySeq(cur).map(t=>row(t)).join('')}<p class="empty tl-empty">${tr('noCurrent')}</p></div>
    ${later.length?`<details class="sub" data-k="later:${key}" ${ui['later:'+key]?'open':''}><summary>${tr('later')} <span class="badge">${later.length}</span></summary>${rows(later,'later:'+key)}</details>`:''}
    ${done.length?`<details class="sub" data-k="done:${key}" ${ui['done:'+key]?'open':''}><summary>${tr('done')} <span class="badge">${done.length}</span></summary>${rows(done,'done:'+key)}</details>`:''}
    <div class="fill"></div>
    <button class="addline" data-act="addTask" ${p?`data-project="${p.id}"`:''}>${tr('addTaskLine')}</button>`;
  return `<section class="proj ${p?'dr':'none'}" ${p?`data-pid="${p.id}"`:''} style="--c:${p?p.color:'var(--line)'}">${head}${meta}${body}</section>`;
}

function initDrag(){
  if(typeof Sortable==='undefined')return;
  const board=document.querySelector('.pboard');
  if(board)Sortable.create(board,{
    handle:'.pgrip',draggable:'.proj.dr',animation:180,ghostClass:'drag-ghost',chosenClass:'drag-chosen',
    forceFallback:true,fallbackOnBody:true,delayOnTouchOnly:true,delay:120,
    onMove:ev=>!(ev.related&&ev.related.classList.contains('none')&&!ev.willInsertAfter),
    onStart(){ui.dragging=true},
    onEnd(ev){
      ui.dragging=false;
      if(ev.oldIndex===ev.newIndex){if(ui.renderLater){ui.renderLater=false;render()}return}
      const ids=[...board.querySelectorAll(':scope > .proj.dr')].map(e=>e.dataset.pid);
      const ps=ids.map(id=>data.projects.find(p=>p.id===id)).filter(Boolean);
      const moved=data.projects.find(p=>p.id===ev.item.dataset.pid),i=ps.indexOf(moved);
      // 앞뒤 카드 중 같은 우선순위가 있으면 그대로, 없으면 바로 뒤(맨 끝이면 앞) 카드의 우선순위를 따름
      const prev=ps[i-1],next=ps[i+1];
      if(![prev,next].some(x=>x&&x.priority===moved.priority)){const nb=next||prev;if(nb)moved.priority=nb.priority}
      const orders=ps.map(p=>p.order||0).sort((a,b)=>a-b);
      for(let k=1;k<orders.length;k++)if(orders[k]<=orders[k-1])orders[k]=orders[k-1]+1;
      ps.forEach((p,k)=>p.order=orders[k]);
      ui.renderLater=false;save();
    }
  });
  // 업무 끌기: 같은 칸 안 순서 변경 + 다른 프로젝트·다른 칸으로 이동
  const reseq=list=>{
    const ts=[...list.querySelectorAll(':scope > .task')].map(r=>data.tasks.find(t=>t.id===r.dataset.id)).filter(Boolean);
    const seqs=ts.map(t=>t.seq||0).sort((a,b)=>a-b);
    for(let i=1;i<seqs.length;i++)if(seqs[i]<=seqs[i-1])seqs[i]=seqs[i-1]+1;
    ts.forEach((t,i)=>t.seq=seqs[i]);
  };
  document.querySelectorAll('.tlist').forEach(el=>Sortable.create(el,{
    group:'tasks',handle:'.grip',draggable:'.task',animation:150,ghostClass:'drag-ghost',chosenClass:'drag-chosen',
    forceFallback:true,fallbackOnBody:true,delayOnTouchOnly:true,delay:120,emptyInsertThreshold:24,
    onStart(){ui.dragging=true;document.body.classList.add('dragging')},
    onEnd(ev){
      ui.dragging=false;document.body.classList.remove('dragging');
      const moved=ev.from!==ev.to;
      if(!moved&&ev.oldIndex===ev.newIndex){if(ui.renderLater){ui.renderLater=false;render()}return}
      if(moved){
        const t=data.tasks.find(x=>x.id===ev.item.dataset.id);
        const [kind,key]=ev.to.dataset.list.split(':');
        if(t){
          t.project=key==='none'?'':key;
          // 놓은 칸에 맞게 상태 조정: 완료 칸 → 완료, 차후 칸 → 차후, 현재 진행 칸 → (완료·차후였다면) 시작 전
          if(kind==='done')t.status='완료';
          else if(kind==='later')t.status='차후';
          else if(['완료','차후'].includes(t.status))t.status='시작 전';
        }
        reseq(ev.from);
      }
      reseq(ev.to);
      data.tasks.sort((a,b)=>(a.seq||0)-(b.seq||0));
      ui.renderLater=false;save();
    }
  }));
}

  const q=ui.q.trim().toLowerCase();
  const list=data.tasks.filter(t=>t.month===ui.month&&inDept(t)&&(!q||[t.title,t.title_en,t.note,t.note_en,tx(t,'title')].join(' ').toLowerCase().includes(q)));
  const curAll=list.filter(t=>['시작 전','진행 중','반려'].includes(t.status));

  const chip=s=>`<button class="${ui.stf===s?'on':''}" data-act="stf" data-s="${s}">${L(s)} ${s==='전체'?curAll.length:curAll.filter(t=>t.status===s).length}</button>`;
  let blocks=sortedProjects().map(p=>{const ts=list.filter(t=>t.project===p.id);return (filtered&&!ts.length&&!(ui.dept===STAR&&p.starred&&!q))?'':projBlock(p,ts)}).join('');
  const loose=ui.dept===STAR?[]:list.filter(t=>!t.project||!data.projects.some(p=>p.id===t.project));

      <span class="grow"></span>
      <button data-act="carry" title="${tr('carryTip')}">${tr('carry')}</button>
    </div>
    ${Store.isEmpty()&&isAdmin()&&!ui.emptyOk?`<section class="sec empty-box"><h3>${tr('emptyH')}</h3><p class="g-p">${tr('emptyP')}</p><div class="actions">
      ${localOld()?`<button class="primary" data-act="uploadLocal">${tr('uploadLocal',localOld().tasks.length)}</button>`:''}
      <label class="btnlike">${tr('importJ')}<input type="file" id="imp" accept=".json,application/json" hidden></label>
      <button data-act="startEmpty">${tr('startEmpty')}</button></div></section>`:''}
    ${ui.dept===STAR?`<p class="star-hint">${tr('starHint')}</p>`:''}
    ${blocks?`<div class="pboard">${blocks}</div>`:`<p class="empty">${ui.dept===STAR?tr('starEmpty'):tr('noProjects')}</p>`}`;
  initDrag();
}

function renderCalendar(){
  const [y,m]=ui.month.split('-').map(Number);
  const startDow=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),today=todayStr();
  const evOk=e=>e.dept===OFFICIAL?ui.showOfficial:(ui.showDeptEv&&(ui.dept==='전체'||e.dept===ui.dept));
  const tkOk=t=>ui.showTasks&&inDept(t)&&t.status!=='반려';
  const evOn=(e,ds)=>e.date<=ds&&(e.end||e.date)>=ds;
  const tkOn=(t,ds)=>{const s=t.start||t.end,e=t.end||t.start;return s&&s<=ds&&ds<=e};
  const pc=t=>{const p=data.projects.find(x=>x.id===t.project);return p?` style="--c:${p.color}"`:''};
  let h='<div class="cal">'+tr('weekdays').map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<startDow;i++)h+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${ui.month}-${pad(d)}`,dow=(startDow+d-1)%7;
    const items=[
      ...data.events.filter(e=>evOk(e)&&evOn(e,ds)).sort((a,b)=>(b.dept===OFFICIAL)-(a.dept===OFFICIAL)).map(e=>`<div class="ci ${e.dept===OFFICIAL?'off':''}" data-act="editEvent" data-id="${e.id}" title="${esc(L(e.dept)+' · '+tx(e,'title'))}">${esc(tx(e,'title'))}</div>`),
      ...data.tasks.filter(t=>tkOk(t)&&tkOn(t,ds)).map(t=>`<div class="ci tk"${pc(t)} data-act="editTask" data-id="${t.id}" title="${esc(L(t.dept)+' · '+tx(t,'title')+' ('+L(t.status)+')')}">${esc(tx(t,'title'))}</div>`)
    ];
    const vis=items.map((x,i)=>i>=4?x.replace('class="ci','class="ci hid'):x).join('');
    h+=`<div class="day ${ds===today?'today':''} ${dow===0?'sun':''}" data-act="addEvent" data-date="${ds}"><div class="dn">${d}</div>${vis}${items.length>4?`<div class="more" data-act="expand">+${items.length-4}</div>`:''}</div>`;
  }
  const tail=(7-(startDow+days)%7)%7;for(let i=0;i<tail;i++)h+='<div class="day blank"></div>';
  h+='</div>';
  const evs=data.events.filter(e=>evOk(e)&&e.date.slice(0,7)===ui.month).sort((a,b)=>a.date.localeCompare(b.date));
  const showing=ui.dept==='전체'?tr('allDeptsShort'):ui.dept===STAR?tr('starBox'):L(ui.dept);
  $('#view').innerHTML=`
    <div class="toolbar">
      <button class="primary" data-act="addEvent" data-date="${today.slice(0,7)===ui.month?today:ui.month+'-01'}">${tr('addEvent')}</button>
      <label><input type="checkbox" data-k="showOfficial" ${ui.showOfficial?'checked':''}> ${tr('showOfficial')}</label>
      <label><input type="checkbox" data-k="showDeptEv" ${ui.showDeptEv?'checked':''}> ${tr('showDeptEv')}</label>
      <label><input type="checkbox" data-k="showTasks" ${ui.showTasks?'checked':''}> ${tr('showTasks')}</label>
      <span class="grow"></span><small style="color:var(--muted)">${esc(tr('calNote',showing))}</small>
    </div>
    ${h}
    <section class="sec agenda"><div class="sec-h"><h3>${tr('agenda',mName(m))}</h3></div>
      ${evs.length?evs.map(e=>`<div class="ag" data-act="editEvent" data-id="${e.id}"><b>${fmtD(e.date)}${e.end&&e.end!==e.date?'–'+fmtD(e.end):''}</b><span class="dtag ${e.dept===OFFICIAL?'off':''}">${esc(L(e.dept))}</span>${esc(tx(e,'title'))}</div>`).join(''):`<p class="empty">${tr('noEvents')}</p>`}
    </section>`;
}

  if(f)f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(new FormData(f))!==false){D.close();save()}});
}
const deptOptions=(sel,official)=>(official?`<option value="${OFFICIAL}" ${sel===OFFICIAL?'selected':''}>${L(OFFICIAL)}</option>`:'')+data.deptGroups.map(g=>`<optgroup label="${esc(L(g.name))}">${g.items.map(d=>`<option value="${esc(d)}" ${d===sel?'selected':''}>${esc(L(d))}</option>`).join('')}</optgroup>`).join('');
const formEnd=(delAct,id)=>`<div class="actions">${id?`<button type="button" class="danger" data-act="${delAct}" data-id="${id}">${tr('del')}</button>`:''}<span class="grow"></span><button type="button" data-act="close">${tr('cancel')}</button><button class="primary">${tr('save')}</button></div>`;

function openTask(id,preset={}){
  const t=id?data.tasks.find(x=>x.id===id):{id:'',title:'',dept:defDept(),status:'시작 전',start:'',end:'',project:'',related:[],note:'',important:false,month:ui.month,...preset};
  const others=data.tasks.filter(x=>x.id!==t.id&&(x.month===t.month||t.related.includes(x.id)));
  dlg(`<h3>${id?tr('editTask'):tr('newTask')}</h3><form>
    ${bi('title',t,tr('taskName'))}
    <div class="row2"><label>${tr('dept')}<select name="dept">${deptOptions(t.dept)}</select></label>
      <label>${tr('status')}<select name="status">${statusOpts(t.status)}</select></label></div>
    <div class="row2"><label>${tr('start')}<input type="date" name="start" value="${t.start}"></label><label>${tr('end')}<input type="date" name="end" value="${t.end}"></label></div>
    <div class="row2"><label>${tr('project')}<select name="project"><option value="">${tr('none')}</option>${data.projects.map(p=>`<option value="${p.id}" ${p.id===t.project?'selected':''}>${esc(tx(p,'name'))}</option>`).join('')}</select></label>
      <label>${tr('recMonth')}<input type="month" name="month" value="${t.month}"></label></div>
    <details class="relbox"><summary>${tr('relLabel')}<span class="badge" id="relCount" ${t.related.length?'':'hidden'}>${t.related.length}</span></summary>
    <div class="rel">${others.map(o=>`<label class="chk"><input type="checkbox" name="rel" value="${o.id}" ${t.related.includes(o.id)?'checked':''}><span class="dtag">${esc(L(o.dept))}</span>${esc(tx(o,'title'))}</label>`).join('')||`<span class="empty">${tr('noOthers')}</span>`}</div></details>
    ${bi('note',t,tr('memo'),true)}
    ${t.updBy?`<p class="note-s" style="margin:0">${esc(tr('lastEdit',t.updBy,fmtStamp(t.updAt)))}</p>`:''}
    ${formEnd('delTask',id)}</form>`,fd=>{
      const start=fd.get('start'),end=fd.get('end');
      if(start&&end&&end<start){alert(tr('badDates'));return false}
      const v={...biRead(fd,t,'title'),...biRead(fd,t,'note'),dept:fd.get('dept'),status:fd.get('status'),start,end,project:fd.get('project'),month:fd.get('month')||ui.month,related:fd.getAll('rel')};
      if(!v.title&&!v.title_en){alert(tr('needName'));return false}
      let task=t;
      if(!id){task={...t,...v,id:uid(),seq:Date.now()};data.tasks.push(task)}else Object.assign(task,v);
      others.forEach(o=>{const should=task.related.includes(o.id),has=o.related.includes(task.id);
        if(should&&!has)o.related.push(task.id);if(!should&&has)o.related=o.related.filter(r=>r!==task.id)});
    });
}
function delTask(id){
  if(!confirm(tr('confirmDelTask')))return;
  data.tasks=data.tasks.filter(t=>t.id!==id);
  data.tasks.forEach(t=>t.related=t.related.filter(r=>r!==id));
  D.close();save();
}
function openEvent(id,preset={}){
  const e=id?data.events.find(x=>x.id===id):{id:'',title:'',dept:allDepts().includes(ui.dept)?ui.dept:OFFICIAL,date:'',end:'',note:'',...preset};
  dlg(`<h3>${id?tr('editEvent'):tr('newEvent')}</h3><form>
    ${bi('title',e,tr('eventName'))}
    <label>${tr('category')}<select name="dept">${deptOptions(e.dept,true)}</select></label>
    <div class="row2"><label>${tr('date')}<input type="date" name="date" required value="${e.date}"></label><label>${tr('endMulti')}<input type="date" name="end" value="${e.end}"></label></div>
    ${bi('note',e,tr('memo'),true)}
    ${formEnd('delEvent',id)}</form>`,fd=>{
      const v={...biRead(fd,e,'title'),...biRead(fd,e,'note'),dept:fd.get('dept'),date:fd.get('date'),end:fd.get('end')};
      if(!v.title&&!v.title_en){alert(tr('needName'));return false}
      if(v.end&&v.end<v.date){alert(tr('badDates'));return false}
      if(id)Object.assign(e,v);else data.events.push({id:uid(),...v});
    });
}
function openProject(id){
  const p=id?data.projects.find(x=>x.id===id):{id:'',name:'',color:'#2f4b7c',desc:'',priority:'보통',order:Date.now()};
  dlg(`<h3>${id?tr('editProject'):tr('newProject')}</h3><form>
    ${bi('name',p,tr('projectName'))}
    ${bi('desc',p,tr('desc'),true)}
    <div class="row2"><label>${tr('priority')}<select name="priority">${prioOpts(p.priority)}</select></label>
    <label>${tr('color')}<input type="color" name="color" value="${p.color}" style="height:40px;padding:2px"></label></div>
    ${formEnd('delProject',id)}</form>`,fd=>{
      const v={...biRead(fd,p,'name'),...biRead(fd,p,'desc'),color:fd.get('color'),priority:fd.get('priority')};
      if(!v.name&&!v.name_en){alert(tr('needName'));return false}
      if(id){if(v.priority!==p.priority)p.order=Date.now();Object.assign(p,v)}else data.projects.push({id:uid(),order:Date.now(),...v});
    });
}
function openSlogan(){
  dlg(`<h3>${tr('sloganH',monthLabel(ui.month))}</h3><form>
    ${bi('s',{s:data.slogans[ui.month],s_en:data.slogansEn[ui.month]},tr('slogan'),true)}
    ${formEnd()}</form>`,fd=>{const m=ui.month,r=biRead(fd,{s:data.slogans[m],s_en:data.slogansEn[m]},'s');
      if(r.s)data.slogans[m]=r.s;else delete data.slogans[m];if(r.s_en)data.slogansEn[m]=r.s_en;else delete data.slogansEn[m]});
}
function openSettings(){
  D.dataset.kind='settings';
  const old=localOld();
  D.innerHTML=`<h3>${tr('settingsH')}</h3>
   <h4 class="sh">${tr('myInfo')}</h4>
   <div class="mrow" style="border:0;padding-top:0"><div class="mi"><b>${esc(me.name||'')}</b> <span class="dtag ${isAdmin()?'off':''}">${tr('role_'+(me.role||'member'))}</span>
     <div class="t-meta"><span>${esc(me.loginId||'')}</span>${me.dept?`<span>${esc(L(me.dept))}</span>`:''}</div></div>
     <div class="mb"><button type="button" data-act="logout">${tr('logout')}</button></div></div>
   <details class="sub"><summary>${tr('changePw')}</summary>
     <form id="pwform" style="margin-top:8px"><div class="row2"><label>${tr('curPw')}<input type="password" name="cur" autocomplete="current-password" required></label>
     <label><span>${tr('newPw')} <small>${tr('pwRule')}</small></span><input type="password" name="nw" autocomplete="new-password" required></label></div>
     <p class="g-err" id="pwerr" hidden></p><div class="actions" style="margin-top:0"><span class="grow"></span><button class="primary">${tr('save')}</button></div></form>
   </details>
   <hr class="hr">
   <div class="lang-row"><span>${tr('language')}</span>
     <div class="seg"><button type="button" class="${lang==='ko'?'on':''}" data-act="lang" data-l="ko">한국어</button><button type="button" class="${lang==='en'?'on':''}" data-act="lang" data-l="en">English</button></div>
   </div>
   <label class="chk" style="margin-top:12px"><input type="checkbox" id="autotr" ${autoTr?'checked':''}> ${tr('autoTr')}</label>
   <p class="note-s">${tr('autoTrNote')}</p>
   <hr class="hr">
   <h4 class="sh">${tr('dataH')}</h4>
   <div class="actions" style="margin-top:0"><button type="button" data-act="export">${tr('exportJ')}</button>
     ${isAdmin()?`<label class="btnlike">${tr('importJ')}<input type="file" id="imp" accept=".json,application/json" hidden></label>`:''}
     ${isAdmin()&&old?`<button type="button" data-act="uploadLocal">${tr('uploadLocal',old.tasks.length)}</button>`:''}</div>
   <div class="actions"><span class="grow"></span><button type="button" data-act="close">${tr('close')}</button></div>`;
  if(!D.open)D.showModal();
  $('#pwform').addEventListener('submit',async e=>{
    e.preventDefault();const fd=new FormData(e.target),err=$('#pwerr');err.hidden=true;
    const nw=fd.get('nw');
    try{
      if(nw.length<6)throw {msg:tr('ePw')};
      const u=auth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,fd.get('cur')));
      await u.updatePassword(nw);
      e.target.reset();alert(tr('pwChanged'));
    }catch(x){err.textContent=x.msg||authErr(x);err.hidden=false}
  });
}
function carryOver(){
  const nm=shiftMonth(ui.month,1);
  const src=data.tasks.filter(t=>t.month===ui.month&&['시작 전','진행 중','차후'].includes(t.status)&&!data.tasks.some(x=>x.month===nm&&x.from===t.id));
  if(!src.length){alert(tr('noCarry'));return}
  if(!confirm(tr('confirmCarry',src.length,monthLabel(nm))))return;
  const map={};src.forEach(t=>map[t.id]=uid());
  src.forEach((t,i)=>data.tasks.push({...t,id:map[t.id],seq:Date.now()+i,from:t.id,month:nm,related:t.related.filter(r=>map[r]).map(r=>map[r])}));
  ui.month=nm;save();
}

/* ========== 이벤트 ========== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'month':ui.month=el.dataset.m;render();break;
    case 'hist':ui.hist=!ui.hist;render();break;
    case 'prevM':ui.month=shiftMonth(ui.month,-1);render();break;
    case 'nextM':ui.month=shiftMonth(ui.month,1);render();break;
    case 'dept':ui.dept=el.dataset.d;render();break;
    case 'lang':setLang(el.dataset.l);render();openSettings();break;
    case 'glang':setLang(el.dataset.l);showScreen($('#gate').dataset.screen||'login');break;
    case 'gmode':gateMode=el.dataset.m;gateErr='';gateMsg='';showScreen('login');break;
    case 'logout':if(D.open)D.close();auth.signOut();break;
    case 'members':openMembers();break;
    case 'mApprove':case 'mReject':case 'mSuspend':case 'mAdmin':case 'mUnadmin':case 'mRemove':memberAction(a,id);break;
    case 'uploadLocal':{const o=localOld();if(o&&(Store.isEmpty()||confirm(tr('confirmImport')))){if(D.open)D.close();importData(o)}break}
    case 'startEmpty':ui.emptyOk=true;render();break;
    case 'pstar':{const p=data.projects.find(x=>x.id===id);p.starred=!p.starred;save();break}
    case 'view':ui.view=el.dataset.v;render();break;
    case 'stf':ui.stf=el.dataset.s;renderProjects();break;
    case 'pinfo':ui.info=ui.info||{};ui.info[el.dataset.k]=!ui.info[el.dataset.k];renderProjects();break;
    case 'pfold':ui.fold[el.dataset.k]=!ui.fold[el.dataset.k];renderProjects();break;
    case 'pmove':{const p=data.projects.find(x=>x.id===id),same=sortedProjects().filter(x=>x.priority===p.priority),i=same.indexOf(p),o=same[i+Number(el.dataset.dir)];if(o){same.forEach((x,k)=>x.order=k);[p.order,o.order]=[o.order,p.order];save()}break}
    case 'slogan':openSlogan();break;
    case 'addTask':openTask(null,el.dataset.project?{project:el.dataset.project}:{});break;
    case 'editTask':openTask(id);break;
    case 'delTask':delTask(id);break;
    case 'addEvent':openEvent(null,{date:el.dataset.date});break;
    case 'editEvent':openEvent(id);break;
    case 'delEvent':if(confirm(tr('confirmDelEvent'))){data.events=data.events.filter(x=>x.id!==id);D.close();save()}break;
    case 'addProject':openProject();break;
    case 'editProject':openProject(id);break;
    case 'delProject':if(confirm(tr('confirmDelProject'))){data.projects=data.projects.filter(p=>p.id!==id);data.tasks.forEach(t=>{if(t.project===id)t.project=''});D.close();save()}break;
    case 'carry':carryOver();break;
    case 'settings':openSettings();break;
    case 'close':D.close();break;
    case 'expand':el.closest('.day').classList.add('expanded');break;
    case 'export':{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='data.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('select.prio')){const p=data.projects.find(x=>x.id===t.dataset.id);if(p){p.priority=t.value;p.order=Date.now();save()}}
  else if(t.name==='rel'&&t.closest('.relbox')){const n=t.closest('.relbox').querySelectorAll('input[name=rel]:checked').length,c=$('#relCount');c.textContent=n;c.hidden=!n}
  else if(t.matches('select.st')){const task=data.tasks.find(x=>x.id===t.dataset.id);if(task){task.status=t.value;save()}}
  else if(t.id==='autotr'){autoTr=t.checked;lsSet('wm_autotr',autoTr);trStop=false;render()}
  else if(t.matches('input[data-k]')){ui[t.dataset.k]=t.checked;renderCalendar()}
  else if(t.id==='imp'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0}catch(err){alert(tr('badJson'));return}
      if(!isAdmin()){alert(tr('importAdminOnly'));return}
      if(Store.isEmpty()||confirm(tr('confirmImport'))){if(D.open)D.close();importData(d)}};t.value='';
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-k]'))ui[e.target.dataset.k]=e.target.open},true);
function onSearch(){const q=$('#q');ui.q=q.value;renderProjects();const n=$('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length)}
document.addEventListener('input',e=>{if(e.target.id==='q'&&!e.isComposing)onSearch()});
document.addEventListener('compositionend',e=>{if(e.target.id==='q')onSearch()});

document.addEventListener('submit',e=>{if(e.target.matches('#gform')){e.preventDefault();gateSubmit(e.target)}});
startAuth();
</script>
</body>
</html>
